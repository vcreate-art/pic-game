# Reverse proxy for pic-game.
# Copy to /etc/nginx/sites-available/pic-game, symlink into sites-enabled,
# swap example.com for your real domain, then run:
#   sudo nginx -t && sudo systemctl reload nginx
# After that, `sudo certbot --nginx -d example.com` will rewrite this file
# to add the 443 server block and the 80 -> 443 redirect.

server {
    listen 80;
    server_name example.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
